!define RELATIVE_INCLUDE

' --- General style settings ---
skinparam defaultFontName Arial
skinparam defaultFontSize 12

' --- Class diagram specific settings ---
skinparam class {
  BackgroundColor #EEEBFF
  BorderColor #584F8C
  ArrowColor #584F8C
  FontColor Black
}

' --- Sequence diagram specific settings ---
skinparam sequence {
  ActorBorderColor #A9D0F5
  LifeLineBorderColor #A9D0F5
  ArrowColor Black
}

' --- Reusable diagrams/macros ---
!definelong CMAKE_TARGET_DEPENDENCIES_GRAPH()
left to right direction

skinparam componentStyle rectangle
skinparam packageStyle rectangle
skinparam shadowing false


package "Applications / Examples" #B0C4DE {
  [EvilDAW] as EVILDAW
  [ExampleEvilCoreClient] as EXAMPLE_CORE
}

package "EvilAudio Static Libraries" #C7E9C0 {
  [EvilDAWLib] as EVILDAWLIB
  [evil_eq_editors_lib] as EQ_EDITORS
  [evil_plugins_lib] as PLUGINS
  [evil_core_lib] as CORE
  [evil_application_architecture_lib] as APP_ARCH
}

package "JUCE Static Wrapper Targets" #FDD0A2 {
  [juce_core_lib] as JUCE_CORE
  [juce_audio_basics_lib] as JUCE_AUDIO_BASICS
  [juce_audio_processors_lib] as JUCE_AUDIO_PROCESSORS
  [juce_audio_devices_lib] as JUCE_AUDIO_DEVICES
  [juce_audio_formats_lib] as JUCE_AUDIO_FORMATS
  [juce_audio_utils_lib] as JUCE_AUDIO_UTILS
  [juce_data_structures_lib] as JUCE_DATA_STRUCTURES
  [juce_dsp_lib] as JUCE_DSP
  [juce_graphics_lib] as JUCE_GRAPHICS
  [juce_gui_basics_lib] as JUCE_GUI_BASICS
  [juce_gui_extra_lib] as JUCE_GUI_EXTRA
}

EVILDAW --> EVILDAWLIB
EXAMPLE_CORE --> EVILDAWLIB
EXAMPLE_CORE --> CORE

EVILDAWLIB --> EQ_EDITORS
EVILDAWLIB --> PLUGINS

EQ_EDITORS --> CORE
APP_ARCH --> CORE

CORE --> JUCE_CORE
PLUGINS --> JUCE_CORE
PLUGINS --> JUCE_AUDIO_BASICS
PLUGINS --> JUCE_AUDIO_PROCESSORS

EVILDAWLIB --> JUCE_AUDIO_DEVICES
EVILDAWLIB --> JUCE_AUDIO_FORMATS
EVILDAWLIB --> JUCE_AUDIO_PROCESSORS
EVILDAWLIB --> JUCE_AUDIO_UTILS
EVILDAWLIB --> JUCE_CORE
EVILDAWLIB --> JUCE_DATA_STRUCTURES
EVILDAWLIB --> JUCE_DSP
EVILDAWLIB --> JUCE_GRAPHICS
EVILDAWLIB --> JUCE_GUI_BASICS
EVILDAWLIB --> JUCE_GUI_EXTRA
!enddefinelong
